name: C7 — restore de teste mensal

# Pega o backup diário mais recente (workflow C7 — backup diário), restaura
# num Postgres efêmero que nasce e morre dentro deste job (services:
# postgres, sem custo nenhum além dos minutos do Actions) e confere que a
# contagem de linhas por tabela bate com o manifesto gerado no dump. Um
# backup que nunca foi restaurado não é backup — ver AGENTS.md, seção C7.
#
# Falha do job = notificação por e-mail automática do GitHub Actions para
# quem observa o workflow (mecanismo padrão, nada customizado aqui).
#
# workflow_dispatch existe para rodar manualmente depois que os secrets
# estiverem cadastrados — não foi disparado nenhuma vez durante o
# desenvolvimento deste workflow, e nunca aponta para o projeto Supabase
# real (o alvo do restore é sempre o Postgres efêmero deste job).

on:
  schedule:
    - cron: "0 7 1 * *" # dia 1 de cada mês, 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  restore-e-conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente Postgres (psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Encontrar o backup diário mais recente
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh api --paginate "repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts[] | select(.name=="db-backup" and .expired==false)' \
            | jq -s 'sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "$run_id" ]; then
            echo "Nenhum artefato 'db-backup' encontrado (ainda não rodou nenhum backup-diario.yml, ou todos expiraram)."
            exit 1
          fi
          echo "Backup mais recente: run $run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Baixar o backup mais recente
        uses: actions/download-artifact@v4
        with:
          name: db-backup
          path: backup-input
          run-id: ${{ steps.latest.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restaurar no Postgres efêmero e conferir contra o manifesto
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          RESTORE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: bash scripts/backup/restore-and-verify.sh
