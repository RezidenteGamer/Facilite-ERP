# Configuração do CLI da Supabase para o projeto Facilite ERP.
#
# O projeto remoto é `Facilite-ERP` (id `ifmdedruuetbbqjbnrkd`, região sa-east-1).
# Este arquivo NÃO contém segredo nenhum — a chave de serviço e a senha do banco
# continuam fora do repositório (ver .env.example).
#
# Até 29/08/2026 nenhum SQL era versionado: as ~52 funções, as policies de RLS e
# os triggers viviam só na Supabase, descritos em prosa no AGENTS.md. Isso é o
# que este diretório passa a corrigir — ver supabase/migrations/README.md.

project_id = "ifmdedruuetbbqjbnrkd"

[db]
# Versão do Postgres do projeto remoto — mantenha igual ao remoto para que
# `supabase db diff` e `supabase db reset` locais reproduzam o mesmo schema.
major_version = 17

[functions.admin-users]
# Cria usuário e reseta senha com service_role. Autentica o chamador por JWT
# dentro da própria função (can_manage_users), então não usa a verificação
# automática do gateway.
verify_jwt = false

[functions.fiscal-emit]
# Emite, cancela e consulta documento fiscal com service_role (tarefa A1,
# 01/09/2026). Ao contrário de `admin-users`, ela **não** tem caso de bootstrap:
# toda chamada exige um usuário autenticado, então a verificação automática do
# gateway fica ligada (`verify_jwt = true`, que é o padrão — declarado aqui de
# propósito, para a diferença em relação à outra função ser intencional e não
# esquecimento). Ela não substitui a checagem interna: a chave anônima também é
# um JWT válido para o gateway, e quem decide de verdade são `has_permission`
# e `has_branch_access`, chamados dentro da função com o token do chamador.
#
# A ação `sweep` (A7, 09/09/2026) é a exceção **dentro** da função, não aqui: ela
# é chamada pelo `pg_cron`, que não tem usuário, e portanto não passa por
# `has_permission`/`has_branch_access`. Ela continua atravessando o gateway (o
# agendador manda a chave anônima no `Authorization`) e se autentica por um
# segredo próprio, `FISCAL_QUEUE_SECRET`, no header `x-fiscal-queue-secret` —
# ver `recusaVarredura` em `index.ts`. `verify_jwt` continua `true`: baixá-lo
# abriria as outras três ações junto.
verify_jwt = true

[functions.fiscal-webhook]
# Recebe a notificação da Focus quando um documento muda de estado (tarefa A8,
# 09/09/2026). É `verify_jwt = false` pelo motivo oposto ao de `fiscal-emit`:
# quem chama é o servidor da Focus, que não tem usuário, não tem sessão do
# Supabase Auth e não tem onde arrumar um JWT. O `Authorization` dela, aliás, é
# justamente o header que o cadastro do gatilho reserva para o **nosso** segredo
# (`authorization_header` / `authorization` em `POST /v2/hooks`).
#
# Baixar o gateway **nesta** função é o que permitiu não baixá-lo em
# `fiscal-emit`: a alternativa seria uma quinta ação lá dentro, e aí `emit`,
# `cancel` e `query` perderiam a verificação junto.
#
# Sem gateway, o porteiro é inteiramente o segredo compartilhado
# `FISCAL_WEBHOOK_SECRET`, no header `FISCAL_WEBHOOK_HEADER` (padrão
# `x-fiscal-webhook-secret`), comparado em tempo constante — ver
# `_shared/http/sharedSecret.ts`. **Falha fechada**: sem o segredo configurado
# ela responde 503 antes de ler o corpo, e é assim que A8 a entrega
# **desligada**. Nenhum gatilho está cadastrado na Focus (isso é A12) e esta
# função não foi implantada.
verify_jwt = false
