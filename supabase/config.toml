# Configuração do CLI da Supabase para o projeto Facilite ERP.
#
# O projeto remoto é `Facilite-ERP` (id `ifmdedruuetbbqjbnrkd`, região sa-east-1).
# Este arquivo NÃO contém segredo nenhum — a chave de serviço e a senha do banco
# continuam fora do repositório (ver .env.example).
#
# Até 29/08/2026 nenhum SQL era versionado: as ~52 funções, as policies de RLS e
# os triggers viviam só na Supabase, descritos em prosa no AGENTS.md. Isso é o
# que este diretório passa a corrigir — ver supabase/migrations/README.md.

project_id = "ifmdedruuetbbqjbnrkd"

[db]
# Versão do Postgres do projeto remoto — mantenha igual ao remoto para que
# `supabase db diff` e `supabase db reset` locais reproduzam o mesmo schema.
major_version = 17

[functions.admin-users]
# Cria usuário e reseta senha com service_role. Autentica o chamador por JWT
# dentro da própria função (can_manage_users), então não usa a verificação
# automática do gateway.
verify_jwt = false

[functions.fiscal-emit]
# Emite, cancela e consulta documento fiscal com service_role (tarefa A1,
# 01/09/2026). Ao contrário de `admin-users`, ela **não** tem caso de bootstrap:
# toda chamada exige um usuário autenticado, então a verificação automática do
# gateway fica ligada (`verify_jwt = true`, que é o padrão — declarado aqui de
# propósito, para a diferença em relação à outra função ser intencional e não
# esquecimento). Ela não substitui a checagem interna: a chave anônima também é
# um JWT válido para o gateway, e quem decide de verdade são `has_permission`
# e `has_branch_access`, chamados dentro da função com o token do chamador.
verify_jwt = true
